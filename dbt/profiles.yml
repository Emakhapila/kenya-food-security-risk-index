# No secrets here: values come from DATABASE_URL via scripts/run_dbt.py.
kfsri:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_PG_HOST') }}"
      port: "{{ env_var('DBT_PG_PORT') | as_number }}"
      user: "{{ env_var('DBT_PG_USER') }}"
      password: "{{ env_var('DBT_PG_PASSWORD') }}"
      dbname: "{{ env_var('DBT_PG_DBNAME') }}"
      sslmode: "{{ env_var('DBT_PG_SSLMODE') }}"
      schema: public
      threads: 4
