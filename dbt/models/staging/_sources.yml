version: 2

sources:
  - name: raw
    description: Raw tables loaded by the Python ingestion layer (ingest/). All data columns are text.
    schema: raw
    tables:
      - name: load_log
        description: One row per ingestion attempt (DL-019).
      - name: fpma
        description: >
          FEWS NET retail white maize prices via FAO GIEWS FPMA, reshaped to long
          at load time (DL-016). One row per export file, month and series.
      - name: wfp_prices
      - name: rainfall
      - name: ndvi
      - name: ipc

  - name: forecasts
    description: Written by modelling/forecast_maize.py, append-only (DL-025).
    schema: forecasts
    tables:
      - name: maize_price_forecast_runs
        description: Every forecast run's rows; never updated or deleted.
