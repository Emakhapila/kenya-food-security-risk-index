version: 2

models:
  - name: stg_fpma__maize_retail
    description: >
      FEWS NET retail white maize, KES per kg, one row per county and month
      (DL-016). Missing months are kept as NULL, not imputed.
    columns:
      - name: county_pcode
        description: Official county code via county_alias. NULL means an unmapped source name.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_county')
                field: county_pcode
      - name: month
        data_tests: [not_null]
      - name: unit
        data_tests:
          - accepted_values:
              arguments:
                values: ["KES/Kg"]
