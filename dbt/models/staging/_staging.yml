version: 2

models:
  - name: stg_fpma__maize_retail
    description: >
      FEWS NET retail white maize, KES per kg, one row per county and month
      (DL-016). Missing months are kept as NULL, not imputed.
    columns:
      - name: county_pcode
        description: Official county code via county_alias. NULL means an unmapped source name.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_county')
                field: county_pcode
      - name: month
        data_tests: [not_null]
      - name: unit
        data_tests:
          - accepted_values:
              arguments:
                values: ["KES/Kg"]

  - name: stg_rainfall__dekadal
    description: CHIRPS rainfall per admin unit and dekad (WFP), latest version of each value.
    columns:
      - name: county_pcode
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_county')
                field: county_pcode
      - name: dekad_start
        data_tests: [not_null]
      - name: adm_level
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: version
        data_tests:
          - accepted_values:
              arguments:
                values: ["final", "prelim"]

  - name: stg_ndvi__dekadal
    description: MODIS NDVI per admin unit and dekad (WFP), latest version of each value.
    columns:
      - name: county_pcode
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_county')
                field: county_pcode
      - name: dekad_start
        data_tests: [not_null]

  - name: stg_ipc__area_phase
    description: >
      IPC acute food insecurity per analysis, area, validity period and phase,
      latest version of each value (DL-018). Keeps projections and excluded
      areas; fct_ipc_county_analysis applies the filters.
    columns:
      - name: county_pcode
        description: Official county code via county_alias. NULL means an unmapped IPC area name.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_county')
                field: county_pcode
      - name: analysis_month
        data_tests: [not_null]
      - name: validity_period
        data_tests:
          - accepted_values:
              arguments:
                values: ["current", "first projection", "second projection"]
      - name: phase
        data_tests:
          - accepted_values:
              arguments:
                values: ["1", "2", "3", "4", "5", "3+", "all"]
      - name: is_subcounty_area
        description: True for areas IPC split below county level (Marsabit, Turkana in 2024-07).
