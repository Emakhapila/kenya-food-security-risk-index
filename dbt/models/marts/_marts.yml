version: 2

models:
  - name: fct_maize_price_monthly
    description: >
      Retail white maize price (KES/kg) per county per month, with every month
      present (missing = NULL). Flags long flat runs (possible carried-forward
      values) and low-resolution series (DL-016). Input to the price forecast.
    columns:
      - name: county_pcode
        data_tests: [not_null]
      - name: month
        data_tests: [not_null]
      - name: is_flat_run
        description: True within runs of identical consecutive prices of at least var('flat_run_min_months').
      - name: is_low_resolution
        description: County series reported in coarse steps (Garissa); evaluated separately.

  - name: fct_climate_county_monthly
    description: >
      Monthly rainfall and NDVI per county with anomalies as % of the long-term
      average (100 = normal). County values come from the county-level unit where
      available, otherwise a pixel-weighted mean of sub-county units (DL-017).
    columns:
      - name: county_pcode
        data_tests: [not_null]
      - name: month
        data_tests: [not_null]
      - name: climate_source_level
        data_tests:
          - accepted_values:
              arguments:
                values: ["adm1", "adm2_proxy"]

  - name: fct_ipc_county_analysis
    description: >
      Validation target for the risk index: share of population in IPC Phase 3+
      per county per analysis, current period only, refugee areas excluded
      (DL-018). Sub-county areas are summed unless a county-level row exists.
      Partial-county areas are flagged by comparing IPC's population with the
      2019 census.
    columns:
      - name: county_pcode
        data_tests: [not_null]
      - name: analysis_month
        data_tests: [not_null]
      - name: share_phase3plus
        description: Phase 3+ population / total analysed population, from numbers not rounded percentages.
        data_tests: [not_null]
      - name: ipc_area_level
        data_tests:
          - accepted_values:
              arguments:
                values: ["county", "subcounty_sum"]
      - name: ipc_coverage_ratio
        description: IPC analysed population / 2019 census population.
      - name: is_partial_county
        description: True when ipc_coverage_ratio < var('ipc_partial_coverage_max'); validate separately.

  - name: fct_risk_index_monthly
    description: >
      Monthly county risk index (DL-022): how unusual rainfall, vegetation and
      maize prices are compared with the county's own earlier history, as
      percentiles oriented so 1 = high risk. Measures shocks, not chronic food
      insecurity. Variant columns require all their components. risk_index is
      the published value: rainfall + vegetation (DL-023), rainfall alone before
      NDVI has 10 years of history; price is kept for analysis only.
    columns:
      - name: county_pcode
        data_tests: [not_null]
      - name: month
        data_tests: [not_null]
      - name: risk_rain
        description: 1 - percentile of the 3-month rainfall total vs the same calendar window in earlier years.
        data_tests: [not_null]
      - name: risk_ndvi
        description: 1 - percentile of NDVI vs the same calendar month in earlier years.
      - name: risk_price
        description: Percentile of price_dev vs all earlier months (16 FEWS NET counties).
      - name: price_dev
        description: log price minus the mean log price of the same month in the 3 previous years.
      - name: index_components
        data_tests:
          - accepted_values:
              arguments:
                values: ["rain", "rain+ndvi"]

  - name: fct_risk_index_ipc
    description: >
      Risk index aligned to each IPC county-analysis for validation (DL-022).
      *_pre3 is the primary alignment (mean over the 3 months before the analysis,
      at least 2 months); *_at_analysis and *_validity are sensitivity checks only.
    columns:
      - name: county_pcode
        data_tests: [not_null]
      - name: analysis_month
        data_tests: [not_null]

  - name: fct_price_forecast
    description: >
      Latest published retail maize price forecast (DL-025): naive at 1 month,
      LightGBM with climate features at 2-3 months (DL-021), with 80% ranges from
      the models' own recent errors. One row per county and horizon.
    columns:
      - name: county_pcode
        data_tests: [not_null]
      - name: horizon
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3]
                quote: false
      - name: model
        data_tests:
          - accepted_values:
              arguments:
                values: ["naive", "lightgbm_climate"]
